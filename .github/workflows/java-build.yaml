name: Java CI with Maven

on:
  push:
    branches:
      - master # Führen Sie den Workflow bei jedem Push auf den 'master'-Branch aus
      - develop # Fügen Sie weitere Branches hinzu, falls nötig

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Check branch/version policy
      run: ./check-branch-version.sh "$GITHUB_REF_NAME"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw

    - name: Build minimal-j
      run: ./mvnw deploy -P github-workflow
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build uitest
      run: ./mvnw deploy -DUiTestDriver=headless -DskipTests -f ./ext/uitest/pom.xml -P github-workflow
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}